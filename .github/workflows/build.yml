name: Build LUBV Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
      - name: Install Dependencies
        run: brew install ldid dpkg
        
      - name: Create required files
        run: |
          # Create all required files
          cat > LUBV.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.innersloth.amongus</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF
          
          cat > control << 'EOF'
          Package: com.yourname.lubv
          Name: LUBV
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Among Us tweak
          Maintainer: Your Name
          Author: Your Name
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000)
          EOF
          
          cat > Tweak.xm << 'EOF'
          #import <UIKit/UIKit.h>
          #import <substrate.h>

          %hook UIViewController

          - (void)viewDidLoad {
              %orig;
              UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@"LUBV" 
                                                              message:@"Tweak loaded!" 
                                                             delegate:nil 
                                                    cancelButtonTitle:@"OK" 
                                                    otherButtonTitles:nil];
              [alert show];
          }

          %end
          EOF
          
          cat > Makefile << 'EOF'
          export TARGET = iphone:clang:latest:7.0
          export ARCHS = arm64

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = LUBV
          LUBV_FILES = Tweak.xm
          LUBV_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          
      - name: Debug - Show files
        run: |
          echo "=== Files in directory ==="
          ls -la
          echo "=== THEOS path ==="
          echo $THEOS
          ls -la $THEOS || echo "THEOS not found"
          
      - name: Build with verbose output
        run: |
          make clean
          make -v
          make
        env:
          ARCHS: arm64
          TARGET: iphone:clang:latest:7.0
          
      - name: Debug - Check build output
        run: |
          echo "=== Checking .theos directory ==="
          find .theos -type f 2>/dev/null || echo "No .theos directory"
          echo "=== Checking for dylibs ==="
          find . -name "*.dylib" 2>/dev/null || echo "No dylibs found"
          echo "=== Checking for debs ==="
          find . -name "*.deb" 2>/dev/null || echo "No debs found"
          echo "=== Full directory structure ==="
          find . -type f 2>/dev/null | head -20
